<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemindMe - PWA</title>
    
    <!-- EXPLICIT ICON LINKS TO FIX YOUR GITHUB ICON ISSUE -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // --- 1. INLINE PWA MANIFEST ---
        const manifestData = {
            "name": "RemindMe PWA",
            "short_name": "RemindMe",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#e2e8f0",
            "theme_color": "#000000",
            "icons": [
                { "src": "icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
                { "src": "icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.write(`<link rel="manifest" href="${manifestUrl}">`);

        // --- 2. INLINE SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            const swLogic = `
                const CACHE_NAME = 'remindme-neo-v2';
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
                
                // Listen for messages from the main thread to show notifications
                self.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'SHOW_NOTIFICATION') {
                        self.registration.showNotification(event.data.title, {
                            body: event.data.body,
                            icon: 'icon.png',
                            vibrate: [200, 100, 200]
                        });
                    }
                });
            `;
            const swBlob = new Blob([swLogic], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('SW registered!'))
                    .catch(err => console.error('SW failed:', err));
            });
        }
    </script>

    <style>
        /* Neo-brutalist Grid Background */
        body {
            background-color: #f0fdf4;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Glassmorphism + Brutalism classes */
        .glass-brutal {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }

        .btn-brutal {
            border: 3px solid #000;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            transition: all 0.15s ease;
        }
        .btn-brutal:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }
        .btn-brutal:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #000; border: 2px solid white; }
    </style>
</head>
<body class="text-black font-sans min-h-screen flex flex-col items-center py-8 px-4">

    <!-- Main Container -->
    <div class="w-full max-w-lg glass-brutal rounded-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-[#a7f3d0] p-6 border-b-4 border-black text-center relative overflow-hidden">
            <h1 class="text-4xl font-black tracking-tighter uppercase relative z-10 text-black">RemindMe</h1>
            <p class="font-bold text-sm mt-2 relative z-10 border-2 border-black inline-block px-3 py-1 bg-white">
                STAY ON TRACK
            </p>
        </div>

        <!-- Input Section -->
        <div class="p-6 border-b-4 border-black bg-white/60">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-black uppercase mb-1">Task / Event</label>
                    <input type="text" id="task-text" placeholder="Drink water, take a walk..." 
                        class="w-full px-4 py-3 border-3 border-black rounded-none focus:outline-none focus:ring-4 focus:ring-green-300 bg-white shadow-[4px_4px_0px_rgba(0,0,0,0.1)] font-bold">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-black uppercase mb-1">Type</label>
                        <select id="task-type" class="w-full px-4 py-3 border-3 border-black rounded-none focus:outline-none focus:ring-4 focus:ring-green-300 bg-white font-bold cursor-pointer">
                            <option value="once">Once</option>
                            <option value="daily">Daily</option>
                            <option value="interval">Interval</option>
                            <option value="days">Specific Days</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-black uppercase mb-1">Start Time</label>
                        <input type="time" id="task-time" 
                            class="w-full px-4 py-3 border-3 border-black rounded-none focus:outline-none focus:ring-4 focus:ring-green-300 bg-white font-bold">
                    </div>
                </div>

                <!-- Interval Settings (Hidden by default) -->
                <div id="interval-settings" class="hidden">
                    <label class="block text-sm font-black uppercase mb-1">Every (Minutes)</label>
                    <input type="number" id="task-interval" placeholder="e.g., 60 for 1 hour" min="1"
                        class="w-full px-4 py-3 border-3 border-black rounded-none focus:outline-none bg-white font-bold">
                </div>

                <!-- Specific Days Settings (Hidden by default) -->
                <div id="days-settings" class="hidden">
                    <label class="block text-sm font-black uppercase mb-1">Select Days</label>
                    <div class="flex justify-between gap-1">
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="0">Su</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="1">Mo</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="2">Tu</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="3">We</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="4">Th</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="5">Fr</button>
                        <button type="button" class="day-btn flex-1 py-2 border-2 border-black bg-white font-bold transition-colors" data-day="6">Sa</button>
                    </div>
                </div>

                <button id="add-btn" class="w-full bg-[#fde047] text-black font-black py-4 px-4 text-lg btn-brutal flex items-center justify-center gap-2 uppercase tracking-wide">
                    <i data-lucide="plus" class="w-6 h-6 stroke-[3]"></i> Add Reminder
                </button>
            </div>
            
            <div id="permission-warning" class="hidden mt-4 text-xs font-bold bg-red-200 p-3 border-2 border-black flex items-start gap-2 shadow-[2px_2px_0px_rgba(0,0,0,1)]">
                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                <span>Notifications are blocked. Please enable them in your browser settings.</span>
            </div>
        </div>

        <!-- Reminders List -->
        <div class="p-6 bg-white/40 max-h-[45vh] overflow-y-auto">
            <h2 class="text-xl font-black uppercase tracking-wider mb-4 border-b-4 border-black pb-2">Active Reminders</h2>
            <div id="reminder-list" class="space-y-4">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            let reminders = JSON.parse(localStorage.getItem('reminders_neo')) || [];
            let selectedDays = [];
            
            const taskText = document.getElementById('task-text');
            const taskTime = document.getElementById('task-time');
            const taskType = document.getElementById('task-type');
            const taskInterval = document.getElementById('task-interval');
            const intervalSettings = document.getElementById('interval-settings');
            const daysSettings = document.getElementById('days-settings');
            const addBtn = document.getElementById('add-btn');
            const reminderList = document.getElementById('reminder-list');
            const dayBtns = document.querySelectorAll('.day-btn');

            // --- UI TOGGLES ---
            taskType.addEventListener('change', (e) => {
                intervalSettings.classList.add('hidden');
                daysSettings.classList.add('hidden');
                
                if (e.target.value === 'interval') {
                    intervalSettings.classList.remove('hidden');
                } else if (e.target.value === 'days') {
                    daysSettings.classList.remove('hidden');
                }
            });

            dayBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const day = parseInt(btn.dataset.day);
                    if (selectedDays.includes(day)) {
                        selectedDays = selectedDays.filter(d => d !== day);
                        btn.classList.remove('bg-black', 'text-white');
                        btn.classList.add('bg-white', 'text-black');
                    } else {
                        selectedDays.push(day);
                        btn.classList.remove('bg-white', 'text-black');
                        btn.classList.add('bg-black', 'text-white');
                    }
                });
            });

            // --- NOTIFICATIONS ---
            function checkPermissions() {
                if ("Notification" in window) {
                    if (Notification.permission === "default") {
                        Notification.requestPermission();
                    } else if (Notification.permission === "denied") {
                        document.getElementById('permission-warning').classList.remove('hidden');
                    }
                }
            }
            checkPermissions();

            function triggerNotification(title, body) {
                if ("Notification" in window && Notification.permission === "granted") {
                    // Try to use Service Worker for better background reliability
                    navigator.serviceWorker.ready.then(registration => {
                        registration.active.postMessage({
                            type: 'SHOW_NOTIFICATION',
                            title: title,
                            body: body
                        });
                    }).catch(() => {
                        // Fallback to standard web notification
                        new Notification(title, { body: body, icon: 'icon.png' });
                    });
                }
            }

            // --- LOGIC & RENDERING ---
            function save() {
                localStorage.setItem('reminders_neo', JSON.stringify(reminders));
            }

            function getNextOccurrence(timeStr, type, intervalMins, specificDays, isTriggeredNow = false) {
                let now = new Date();
                let [hours, minutes] = timeStr.split(':');
                let target = new Date();
                
                if (!isTriggeredNow) {
                    target.setHours(hours, minutes, 0, 0);
                    // If the time already passed today, start from tomorrow for 'once' or 'daily'
                    if (target.getTime() <= now.getTime() && (type === 'once' || type === 'daily')) {
                        target.setDate(target.getDate() + 1);
                    }
                } else {
                    target = now;
                }

                if (type === 'interval' && isTriggeredNow) {
                    target.setMinutes(target.getMinutes() + parseInt(intervalMins));
                    return target.getTime();
                }

                if (type === 'daily' && isTriggeredNow) {
                    target.setDate(target.getDate() + 1);
                    target.setHours(hours, minutes, 0, 0);
                    return target.getTime();
                }

                if (type === 'days') {
                    target.setHours(hours, minutes, 0, 0);
                    if (isTriggeredNow) {
                        target.setDate(target.getDate() + 1);
                    } else if (target.getTime() <= now.getTime()) {
                        target.setDate(target.getDate() + 1);
                    }

                    // Find the next available day
                    let safetyCounter = 0;
                    while (!specificDays.includes(target.getDay()) && safetyCounter < 8) {
                        target.setDate(target.getDate() + 1);
                        safetyCounter++;
                    }
                    return target.getTime();
                }

                return target.getTime();
            }

            function formatDisplayInfo(r) {
                if (r.type === 'once') return `Once at ${r.timeStr}`;
                if (r.type === 'daily') return `Daily at ${r.timeStr}`;
                if (r.type === 'interval') return `Every ${r.interval} mins (Next: ${new Date(r.nextTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
                if (r.type === 'days') {
                    const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
                    const daysStr = r.days.map(d => dayNames[d]).join(', ');
                    return `${daysStr} at ${r.timeStr}`;
                }
            }

            function render() {
                reminderList.innerHTML = '';
                
                if (reminders.length === 0) {
                    reminderList.innerHTML = `<p class="font-bold text-gray-500 text-center py-4 border-2 border-dashed border-gray-400">NO ACTIVE REMINDERS</p>`;
                    return;
                }

                reminders.forEach(r => {
                    const item = document.createElement('div');
                    item.className = `bg-white p-4 border-3 border-black shadow-[4px_4px_0px_rgba(0,0,0,1)] flex justify-between items-center`;
                    
                    item.innerHTML = `
                        <div class="overflow-hidden pr-2">
                            <h3 class="font-black text-lg truncate">${r.text}</h3>
                            <p class="text-sm font-bold bg-[#fef08a] inline-block px-2 border border-black mt-1">
                                ${formatDisplayInfo(r)}
                            </p>
                        </div>
                        <button onclick="deleteReminder('${r.id}')" class="bg-red-400 p-2 border-2 border-black hover:translate-y-1 hover:translate-x-1 hover:shadow-none shadow-[2px_2px_0px_rgba(0,0,0,1)] transition-all shrink-0">
                            <i data-lucide="x" class="w-5 h-5 font-black"></i>
                        </button>
                    `;
                    reminderList.appendChild(item);
                });
                lucide.createIcons();
            }

            window.deleteReminder = (id) => {
                reminders = reminders.filter(r => r.id !== id);
                save();
                render();
            };

            addBtn.addEventListener('click', () => {
                const text = taskText.value.trim();
                const timeStr = taskTime.value;
                const type = taskType.value;
                const intervalMins = taskInterval.value;

                if (!text || !timeStr || (type === 'interval' && !intervalMins) || (type === 'days' && selectedDays.length === 0)) {
                    addBtn.classList.add('bg-red-400');
                    setTimeout(() => addBtn.classList.remove('bg-red-400'), 500);
                    return;
                }

                const nextTime = getNextOccurrence(timeStr, type, intervalMins, selectedDays, false);

                reminders.push({
                    id: crypto.randomUUID(),
                    text,
                    timeStr,
                    type,
                    interval: intervalMins,
                    days: [...selectedDays],
                    nextTime: nextTime
                });

                save();
                render();
                checkPermissions();

                // Reset forms
                taskText.value = '';
                taskTime.value = '';
            });

            // --- BACKGROUND LOOP ---
            setInterval(() => {
                const now = Date.now();
                let changed = false;

                reminders = reminders.filter(r => {
                    if (now >= r.nextTime) {
                        triggerNotification("⏰ Reminder: " + r.text, "Time to get it done!");
                        
                        if (r.type === 'once') {
                            changed = true;
                            return false; // Remove 'once' reminders
                        } else {
                            // Calculate next occurrence for recurring tasks
                            r.nextTime = getNextOccurrence(r.timeStr, r.type, r.interval, r.days, true);
                            changed = true;
                            return true;
                        }
                    }
                    return true;
                });

                if (changed) {
                    save();
                    render();
                }
            }, 5000); // Check every 5 seconds to be efficient

            render();
        });
    </script>
</body>
</html>
